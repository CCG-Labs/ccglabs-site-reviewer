version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint peers on typescript <6.1.0; revisit when it supports 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # vitest 5 requires Node >=22.12; CI and engines target Node 20.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, so update them together.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
