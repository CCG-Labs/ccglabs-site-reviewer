name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 6 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # Code scanning on private repos requires GitHub Advanced Security;
    # this job activates automatically when the repo becomes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
